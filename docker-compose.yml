services:

  # ==========================================================
  # MLFLOW SERVER
  # ==========================================================

  mlflow:

    image: python:3.12-slim

    container_name: churn-mlflow

    working_dir: /mlflow

    volumes:
      - ./mlruns:/mlflow/mlruns

    ports:
      - "5000:5000"

    command:
      - sh
      - -c
      - |
        pip install mlflow
        mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow.db
        --default-artifact-root /mlflow/mlruns


  # ==========================================================
  # CHURN ML PIPELINE
  # ==========================================================

  churn-app:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: churn-app

    depends_on:
      - mlflow

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    command:
      - python
      - src/train.py